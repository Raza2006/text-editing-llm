name: checks
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pydantic shellcheck-py
      - run: shellcheck -x install.sh textedit scripts/lib.sh && shellcheck -s sh llama/entrypoint.sh
      - run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Code checks (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $r = foreach ($f in 'install.ps1', 'scripts/textedit.ps1', 'scripts/lib.ps1') { Invoke-ScriptAnalyzer -Path $f -Severity Error }
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Tests in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows_lib.tests.ps1
      - name: Tests in PowerShell 7
        shell: pwsh
        run: ./tests/windows_lib.tests.ps1

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install (test mode, tiny model on the CPU)
        run: sudo CI_ADMIN_EMAIL=admin@example.com CI_ADMIN_PASSWORD=ci-password-1 ./install.sh --ci
      - name: End-to-end checks
        run: sudo ./tests/e2e.sh
      - name: Logs on failure
        if: failure()
        run: |
          sudo ./textedit logs || true
          sudo cat data/install.log || true
